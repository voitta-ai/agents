[project]
name = "agents-framework"
version = "0.1.0"
description = "Framework for small, single-purpose pain-signal / lead-finding agents."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "icalendar>=6.0",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# transport: session on the slack-workspace source (issue #45).
slack-session = ["pycookiecheat>=0.6"]
# twitter-post action (issue #48).
twitter = ["requests-oauthlib>=1.3"]

[project.scripts]
agent = "framework.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["framework", "framework.plugins"]
