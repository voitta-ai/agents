[project]
name = "agents-framework"
version = "0.1.0"
description = "Framework for small, single-purpose pain-signal / lead-finding agents."
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "httpx>=0.28",
    "icalendar>=6.0",
    "litellm>=1.83",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# transport: session on the slack-workspace source (issue #45).
slack-session = ["pycookiecheat>=0.6"]
# twitter-post action (issue #48).
twitter = ["requests-oauthlib>=1.3"]
# approval buttons over Socket Mode: `agent approvals --listen` (issue #74).
approvals-buttons = ["slack_sdk>=3.27", "websocket-client>=1.7"]

[project.scripts]
agent = "framework.cli:main"

[build-system]
# setuptools 77 is the first release that understands the PEP 639 license
# fields above: `license` as a bare SPDX expression and `license-files`. On
# 61 through 76 the build fails outright with "`project.license` must be valid
# exactly by one definition", because those versions accept only the older
# table forms, {text = "..."} or {file = "..."}. Checked against 75.8.0, which
# fails, and 77.0.3 and 80.9.0, which both build and emit
# `License-Expression: AGPL-3.0-or-later` with the LICENSE file in the wheel.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["framework", "framework.plugins"]
